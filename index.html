<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Equipo · Natación Sincronizada</title>
<style>
  :root{
    --navy:#0A0F8C;
    --navy-2:#080B66;
    --teal:#0099FF;
    --teal-light:#E3F2FF;
    --coral:#0099FF;
    --sand:#F4F7FC;
    --ink:#0A0F8C;
    --line:#D6E0EF;
    --green:#3E7D57;
    --red:#B24A3C;
    --white:#FFFFFF;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--sand);
    color:var(--ink);
    line-height:1.5;
  }
  .app{
    display:grid;
    grid-template-columns:220px 1fr;
    min-height:100vh;
  }
  .rail{
    background:var(--navy);
    color:var(--white);
    padding:28px 0 20px;
    display:flex;
    flex-direction:column;
  }
  .rail-brand{
    padding:0 22px 22px;
    border-bottom:1px solid rgba(255,255,255,.14);
    margin-bottom:10px;
  }
  .rail-logo{width:56px;height:auto;display:block;border-radius:6px;background:#fff;padding:4px;}
  .rail-brand h1{
    font-size:16px;
    font-weight:600;
    margin:8px 0 2px;
    letter-spacing:.2px;
  }
  .rail-brand p{margin:0;font-size:12px;color:#AFC7CF;}
  nav{display:flex;flex-direction:column;margin-top:6px;}
  .nav-btn{
    all:unset;
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 22px;
    color:#CBE1E6;
    font-size:14px;
    cursor:pointer;
    border-left:3px solid transparent;
  }
  .nav-btn:hover{background:rgba(255,255,255,.06);}
  .nav-btn.active{
    background:rgba(255,255,255,.09);
    border-left:3px solid var(--coral);
    color:var(--white);
    font-weight:600;
  }
  .rail-foot{
    margin-top:auto;
    padding:16px 22px 0;
    border-top:1px solid rgba(255,255,255,.14);
  }
  .rail-foot button{
    all:unset;
    display:block;
    width:100%;
    text-align:left;
    font-size:12px;
    color:#AFC7CF;
    cursor:pointer;
    padding:6px 0;
  }
  .rail-foot button:hover{color:var(--white);}
  main{padding:32px 40px 60px;max-width:1100px;}
  h2.page-title{
    font-size:22px;
    margin:0 0 4px;
    font-weight:700;
  }
  .page-sub{
    color:#5A6B6B;
    font-size:13.5px;
    margin:0 0 26px;
  }
  .panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:22px;
  }
  .panel h3{
    font-size:14.5px;
    margin:0 0 14px;
    font-weight:700;
    color:var(--navy-2);
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .btn{
    all:unset;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:9px 16px;
    border-radius:var(--radius);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    background:var(--teal);
    color:var(--white);
  }
  .btn:hover{background:#166E6E;}
  .btn.secondary{
    background:var(--white);
    color:var(--navy-2);
    border:1px solid var(--line);
  }
  .btn.secondary:hover{background:#F0F0EC;}
  .btn.danger{background:var(--white);color:var(--red);border:1px solid #E3C9C4;}
  .btn.danger:hover{background:#FBEEEC;}
  .btn.small{padding:5px 10px;font-size:12px;}
  input,select,textarea{
    font-family:inherit;
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--white);
    color:var(--ink);
  }
  label{font-size:12.5px;color:#5A6B6B;display:block;margin-bottom:4px;}
  .field{display:flex;flex-direction:column;gap:2px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);}
  th{color:#5A6B6B;font-weight:600;font-size:12.5px;}
  tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}
  .pct-badge{display:inline-block;padding:3px 9px;border-radius:20px;font-weight:700;font-size:12.5px;}
  .pct-high{background:#E4EEE6;color:var(--green);}
  .pct-mid{background:#FBF0DC;color:#9B6B12;}
  .pct-low{background:#F7E2DD;color:var(--red);}
  .athlete-card{
    border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
    display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
  }
  .athlete-name{font-weight:700;font-size:14px;}
  .athlete-cat{font-size:12px;color:#5A6B6B;}
  .empty-state{padding:30px 10px;text-align:center;color:#7C8C8C;font-size:13.5px;}
  dialog{
    border:none;border-radius:var(--radius);padding:0;
    width:min(480px,92vw);max-height:88vh;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  dialog.wide{ width:min(620px,94vw); }
  .dialog-head{background:var(--navy);color:var(--white);padding:16px 20px;font-weight:700;font-size:14.5px;}
  .dialog-body{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:70vh;overflow-y:auto;}
  .dialog-foot{padding:14px 20px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--teal-light);color:var(--teal);font-weight:600;}
  .chart-wrap{margin-bottom:22px;}
  .chart-title{font-size:13.5px;font-weight:700;margin-bottom:2px;}
  .chart-subtitle{font-weight:700;font-size:12.5px;margin:4px 0 2px;color:var(--navy-2);}
  .chart-delta{font-size:12px;margin-bottom:8px;}
  .delta-up{color:var(--green);}
  .delta-down{color:var(--red);}
  .delta-flat{color:#7C8C8C;}
  .jump-pct{font-size:13px;font-weight:600;color:var(--navy-2);margin-top:6px;padding:8px 12px;background:var(--teal-light);border-radius:var(--radius);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .stat-box{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .stat-box .num{font-size:24px;font-weight:700;}
  .stat-box .lbl{font-size:12px;color:#5A6B6B;}
  .hint{font-size:12px;color:#7C8C8C;margin-top:2px;}
  .divider{height:1px;background:var(--line);margin:18px 0;}
  select.athlete-select{min-width:180px;}
  .att-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);}
  .att-row:last-child{border-bottom:none;}
  .att-row-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .att-btn{all:unset;padding:8px 15px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;color:#5A6B6B;background:var(--white);}
  .att-btn:hover{background:#F0EFE9;}
  .att-btn.active{font-weight:700;}
  .color-picker{display:flex;gap:8px;flex-wrap:wrap;}
  .color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;}
  .color-swatch.selected{border-color:var(--navy);box-shadow:0 0 0 2px var(--white) inset;}
  .test-group-card{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
  .test-group-head{background:#F0EFE9;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;}
  .test-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);}
  .color-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;}
  .test-row .test-name{font-weight:600;flex:1;}
  .res-group-title{font-weight:700;font-size:12.5px;margin:14px 0 4px;color:#5A6B6B;}
  .res-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
  .res-row label{flex:1;margin:0;color:var(--ink);font-size:13.5px;}
  .res-row input{width:110px;}
  .photo-compare{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .photo-compare-title{font-weight:700;font-size:12.5px;margin-bottom:8px;}
  .compare-img{width:140px;height:140px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;}
  .compare-img-empty{width:140px;height:140px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:#7C8C8C;padding:8px;box-sizing:border-box;}
  @media print{
    .rail,.no-print{display:none !important;}
    main{padding:0;max-width:100%;}
    .app{grid-template-columns:1fr;}
  }
  body.print-mode .app > main > *:not(#printArea){display:none !important;}
  body.print-mode #printArea{display:block !important;}

  /* ---- Login / auth screen ---- */
  #authScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--navy);padding:20px;
  }
  .auth-card{
    background:var(--white);border-radius:8px;padding:32px 30px;width:340px;
    box-shadow:0 12px 40px rgba(0,0,0,.3);text-align:center;
  }
  .auth-card-wide{width:520px;max-width:92vw;}
  .auth-logo{width:110px;height:auto;display:block;margin:0 auto;}
  .auth-card h1{font-size:20px;margin:8px 0 2px;text-align:center;}
  .auth-card h2{font-size:17px;margin:0 0 4px;}
  .app.athlete-mode .rail{display:none;}
  .app.athlete-mode{grid-template-columns:1fr;}
  .app.athlete-mode main{max-width:760px;margin:0 auto;padding:32px 20px 60px;}
  .athlete-pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:18px;}
  .athlete-pick-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--white);padding:18px 12px;text-align:center;cursor:pointer;}
  .athlete-pick-card:hover{background:var(--teal-light);border-color:var(--teal);}
  .athlete-avatar{width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;margin:0 auto 8px;}
  .athlete-profile-header{display:flex;align-items:center;gap:16px;}
  .athlete-profile-header .athlete-avatar{width:60px;height:60px;font-size:24px;margin:0;}
  #busyOverlay{position:fixed;inset:0;background:rgba(11,43,60,.55);display:none;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;z-index:9999;}
</style>
</head>

function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }
function formatDateShort(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}`;
}
function formatMonthLabel(monthStr){
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  return `${meses[parseInt(m,10)-1]} ${y}`;

function readAndResizeImage(file, maxDim, quality, callback){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w >= h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else{ if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============ DIALOGO GENÉRICO ============ */
function openDialog(title, bodyHtml, onSave, opts){
  document.getElementById('dialogTitle').textContent = title;
  document.getElementById('dialogBody').innerHTML = bodyHtml;
  document.getElementById('dialogSave').onclick = () => { onSave(); };
  const dlg = document.getElementById('dialog');
  dlg.classList.toggle('wide', !!(opts && opts.wide));
  dlg.showModal();
}
function closeDialog(){ document.getElementById('dialog').close(); }
window.closeDialog = closeDialog;

let authView = 'role'; // 'role' | 'adminLogin' | 'athleteLogin'
let authError = '';
let athleteDirectoryCache = null;
let selectedLoginAthlete = null;

window.goAuthView = function(view){
  authView = view;
  authError = '';
  if(view !== 'athleteLogin') selectedLoginAthlete = null;
  renderAuthScreen();
};
window.backToAthletePicker = function(){
  selectedLoginAthlete = null;
  authError = '';
  renderAuthScreen();
};

function showAuthScreen(){
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appShell').style.display = 'none';
  authView = 'role'; selectedLoginAthlete = null; authError = '';
  renderAuthScreen();
}
function showApp(){
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appShell').style.display = '';
  document.querySelector('.app').classList.toggle('athlete-mode', currentRole==='athlete');
  activeTab = 'inicio';
  render();
}

async function renderAthleteLoginScreen(){
  const el = document.getElementById('authScreen');
  if(!athleteDirectoryCache){
    el.innerHTML = `<div class="auth-card"><p class="hint">Cargando...</p></div>`;
    try{
      const snap = await getDocs(collection(db,'athleteDirectory'));
      athleteDirectoryCache = snap.docs.map(d=>({id:d.id, ...d.data()}));
    }catch(e){
      el.innerHTML = `<div class="auth-card"><p class="hint">No se pudo cargar la lista de atletas.</p></div>`;
      return;
    }
  }
  if(!selectedLoginAthlete){
    const cards = athleteDirectoryCache.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(a=>`
      <div class="athlete-pick-card" onclick="pickLoginAthlete('${a.id}')">
        <div class="athlete-avatar">${escapeHtml(a.name.trim().charAt(0).toUpperCase())}</div>
        <div style="font-weight:700;">${escapeHtml(a.name)}</div>
      </div>
    `).join('') || `<p class="hint">Todavía no hay atletas cargadas.</p>`;
    el.innerHTML = `
      <div class="auth-card auth-card-wide">
        <button class="btn small secondary" onclick="goAuthView('role')">← Volver</button>
        <h2 style="margin-top:16px;">¿Quién eres?</h2>
        <p class="hint">Tocá tu nombre.</p>
        <div class="athlete-pick-grid">${cards}</div>
      </div>`;
  }else{
    el.innerHTML = `
      <div class="auth-card">
        <button class="btn small secondary" onclick="backToAthletePicker()">← Volver</button>
        <h2 style="margin-top:16px;">Hola, ${escapeHtml(selectedLoginAthlete.name.split(' ')[0])} 👋</h2>
        <p class="hint">Ingresá tu PIN de 6 dígitos.</p>
        <input id="athletePinInput" type="tel" maxlength="6" inputmode="numeric" autofocus
          style="font-size:26px;text-align:center;letter-spacing:8px;width:190px;margin:14px auto;display:block;"
          placeholder="••••••" oninput="handleAthletePinInput(this)">
        ${authError?`<div class="hint" style="color:var(--red);text-align:center;font-weight:600;">${escapeHtml(authError)}</div>`:''}
      </div>`;
  }
}
window.pickLoginAthlete = function(id){
  selectedLoginAthlete = athleteDirectoryCache.find(a=>a.id===id);
  authError=''; renderAuthScreen();
};
window.handleAthletePinInput = async function(input){
  const val = input.value.replace(/\D/g,'').slice(0,6);
  input.value = val;
  if(val.length===6){
    try{
      await signInWithEmailAndPassword(auth, selectedLoginAthlete.authEmail, val);
    }catch(e){
      authError = 'PIN incorrecto, probá de nuevo.';
      renderAuthScreen();
    }
  }
};
window.adminLogin = async function(){
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    authError = 'Email o contraseña incorrectos.';
    renderAuthScreen();
  }
};
window.logout = function(){ signOut(auth); };

onAuthStateChanged(auth, async (user) => {
  stopListeners();
  if(!user){
    currentUser=null; currentRole=null; currentAthleteId=null;
    showAuthScreen();
    return;
  }
  currentUser = user;
  try{
    const adminSnap = await getDoc(doc(db,'admins',user.uid));
    if(adminSnap.exists()){
      currentRole = 'admin';
      startAdminListeners();
      showApp();
      return;
    }
    const q = query(collection(db,'athletes'), where('authUid','==',user.uid));
    const snap = await getDocs(q);
    if(!snap.empty){
      currentRole = 'athlete';
      currentAthleteId = snap.docs[0].id;
      startAthleteListeners();
      showApp();
      return;
    }
    alert('Tu cuenta no está vinculada a ningún perfil todavía. Avisale a tu entrenadora.');
    await signOut(auth);
  }catch(e){
    alert('Error al iniciar sesión: '+e.message);
    await signOut(auth);
  }
});

/* ============================================================
   ESCUCHA DE DATOS EN TIEMPO REAL (Firestore)
   ============================================================ */
function stopListeners(){
  unsubscribers.forEach(u=>u());
  unsubscribers = [];
  state = { athletes:[], attendance:[], testGroups:[], testDefs:[], testResults:[] };
}

function startAdminListeners(){
  unsubscribers.push(onSnapshot(collection(db,'athletes'), snap=>{
    state.athletes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  unsubscribers.push(onSnapshot(collection(db,'attendance'), snap=>{
    state.attendance = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  unsubscribers.push(onSnapshot(collection(db,'testGroups'), snap=>{
    state.testGroups = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  unsubscribers.push(onSnapshot(collection(db,'testDefs'), snap=>{
    state.testDefs = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  unsubscribers.push(onSnapshot(collection(db,'testResults'), snap=>{
    state.testResults = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
}

function startAthleteListeners(){
  const myUid = currentUser.uid;
  unsubscribers.push(onSnapshot(doc(db,'athletes',currentAthleteId), d=>{
    state.athletes = d.exists() ? [{id:d.id, ...d.data()}] : [];
    render();
  }));
  unsubscribers.push(onSnapshot(query(collection(db,'attendance'), where('authUid','==',myUid)), snap=>{
    state.attendance = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  unsubscribers.push(onSnapshot(collection(db,'testGroups'), snap=>{
    state.testGroups = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  unsubscribers.push(onSnapshot(collection(db,'testDefs'), snap=>{
    state.testDefs = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  unsubscribers.push(onSnapshot(query(collection(db,'testResults'), where('authUid','==',myUid)), snap=>{
    state.testResults = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
}

window.newAthlete = function(){
  const suggestedPin = randomPin();
  openDialog('Agregar atleta', `
    <div class="field"><label>Nombre</label><input id="f_name" placeholder="Nombre y apellido"></div>
    <div class="field"><label>Categoría / Grupo</label><input id="f_cat" placeholder="Ej: Infantil, Juvenil, Equipo A"></div>
    <div class="field"><label>Fecha de nacimiento (opcional)</label><input id="f_bday" type="date"></div>
    <div class="field"><label>Estatura en cm (opcional)</label><input id="f_height" type="number" step="0.1"></div>
    <div class="field"><label>PIN de acceso (6 dígitos)</label>
      <input id="f_pin" value="${suggestedPin}" maxlength="6" inputmode="numeric">
      <div class="hint">Se lo das a la atleta para que entre a ver su progreso. Podés cambiarlo si querés.</div>
    </div>
  `, async () => {

    if(!name){ alert('El nombre es obligatorio.'); return; }
    const pin = document.getElementById('f_pin').value.trim();
    if(!/^\d{6}$/.test(pin)){ alert('El PIN debe tener exactamente 6 dígitos.'); return; }
    const cat = document.getElementById('f_cat').value.trim();
    const bday = document.getElementById('f_bday').value || null;
    const heightRaw = document.getElementById('f_height').value;
    const height = heightRaw!=='' ? parseFloat(heightRaw) : null;
    closeDialog();
    showBusy('Creando acceso...');
    try{
      const newRef = doc(collection(db,'athletes'));
      const fakeEmail = `athlete-${newRef.id}@${ATHLETE_EMAIL_DOMAIN}`;
      const cred = await createUserWithEmailAndPassword(secondaryAuth, fakeEmail, pin);
      await signOut(secondaryAuth);
      await setDoc(newRef, {
        name, category:cat, birthday:bday, height,
        authUid: cred.user.uid, authEmail: fakeEmail,
        createdAt: serverTimestamp()
      });
      await setDoc(doc(db,'athleteDirectory',newRef.id), {name, authEmail:fakeEmail});
      hideBusy();
      alert(`Atleta creada.\nSu PIN de acceso es: ${pin}\n(Anotalo, no se puede volver a mostrar.)`);
    }catch(e){
      hideBusy(); alert('Hubo un error: '+e.message);
    }
  });
};

window.deleteAthlete = async function(id){

  showBusy('Eliminando...');
  try{
    await deleteDoc(doc(db,'athletes',id));
    await deleteDoc(doc(db,'athleteDirectory',id)).catch(()=>{});
    const attSnap = await getDocs(query(collection(db,'attendance'), where('athleteId','==',id)));
    for(const d of attSnap.docs) await deleteDoc(d.ref);
    const resSnap = await getDocs(query(collection(db,'testResults'), where('athleteId','==',id)));
    for(const d of resSnap.docs) await deleteDoc(d.ref);
    hideBusy();
  }catch(e){ hideBusy(); alert('Error: '+e.message); }
};

/* ============================================================
   ASISTENCIA
   ============================================================ */
let attMonthFilter = new Date().toISOString().slice(0,7);
let asistSelectedDate = new Date().toISOString().slice(0,10);
let asistCategoryFilter = 'Todas';

window.setAsistDate = function(d){ asistSelectedDate = d; render(); };
window.setAsistCategoryFilter = function(v){ asistCategoryFilter = v; render(); };
window.setAttMonthFilter = function(v){ attMonthFilter = v; render(); };

const ATTENDANCE_STATUSES = {
  presente: {label:'Asistió',    bg:'#E4EEE6', fg:'#2E5A3B'},
  ausente:  {label:'No asistió', bg:'#F7E2DD', fg:'#8C3427'},
  tardanza: {label:'Llegó tarde',bg:'#FBF0DC', fg:'#8A611A'},
  cteib:    {label:'CTEIB',      bg:'#DCEFEF', fg:'#166E6E'}
};
const ATTENDANCE_COUNTS_AS_PRESENT = ['presente','cteib'];

function uniqueDates(){ return [...new Set(state.attendance.map(r=>r.date))].sort(); }
function uniqueMonths(){ return [...new Set(uniqueDates().map(d=>d.slice(0,7)))].sort(); }

function viewAsistencia(){
  if(state.athletes.length===0){
    return `<h2 class="page-title">Asistencia</h2><div class="panel"><div class="empty-state">Agregá atletas primero en la pestaña "Atletas".</div></div>`;
  }
  const categories = ['Todas', ...Array.from(new Set(state.athletes.map(a=>a.category).filter(Boolean))).sort()];
  if(!categories.includes(asistCategoryFilter)) asistCategoryFilter='Todas';
  const filtered = state.athletes
    .filter(a=> asistCategoryFilter==='Todas' || a.category===asistCategoryFilter)
    .sort((a,b)=>a.name.localeCompare(b.name));
  const markedCount = filtered.filter(a => state.attendance.some(r=>r.athleteId===a.id && r.date===asistSelectedDate)).length;

  const rows = filtered.map(a=>{
    const rec = state.attendance.find(r=>r.athleteId===a.id && r.date===asistSelectedDate);
    const status = rec ? rec.status : null;
    const btns = Object.keys(ATTENDANCE_STATUSES).map(key=>{
      const st = ATTENDANCE_STATUSES[key];
      const active = status===key;
      return `<button type="button" class="att-btn ${active?'active':''}" style="${active?`background:${st.bg};color:${st.fg};border-color:${st.fg};`:''}" onclick="setAttendanceStatusForDate('${a.id}','${asistSelectedDate}','${key}')">${st.label}</button>`;
    }).join('');
    return `<div class="att-row"><div><strong>${escapeHtml(a.name)}</strong> <span class="hint">· ${escapeHtml(a.category||'Sin categoría')}</span></div><div class="att-row-btns">${btns}</div></div>`;
  }).join('') || `<div class="empty-state">No hay atletas en esta categoría.</div>`;

  const months = uniqueMonths();
  if(!months.includes(attMonthFilter)) attMonthFilter = months[months.length-1] || attMonthFilter;
  const monthOptions = months.map(m=>`<option value="${m}" ${m===attMonthFilter?'selected':''}>${formatMonthLabel(m)}</option>`).join('')
    || `<option value="${attMonthFilter}">${formatMonthLabel(attMonthFilter)}</option>`;

  const summary = state.athletes.map(a=>{
    const monthly = attendancePct(a.id, attMonthFilter);
    const annual = attendancePct(a.id, attMonthFilter.slice(0,4), true);
    return `<tr><td>${escapeHtml(a.name)}</td><td>${pctBadge(monthly)}</td><td>${pctBadge(annual)}</td></tr>`;
  }).join('');

  const datesList = uniqueDates().slice().reverse().slice(0,60).map(d=>{
    const count = state.attendance.filter(r=>r.date===d).length;
    return `<div class="test-row">
      <span class="test-name">${formatDateShort(d)}</span>
      <span class="hint">${count} marca(s)</span>
      <button class="btn small secondary" onclick="setAsistDate('${d}')">Ir</button>
      <button class="btn small danger" onclick="deleteAttendanceDate('${d}')">Eliminar fecha</button>
    </div>`;
  }).join('') || `<div class="empty-state">Todavía no marcaste asistencia en ninguna fecha.</div>`;

  return `
    <h2 class="page-title">Asistencia</h2>
    <p class="page-sub">Elegí la fecha y marcá el estado de cada atleta.</p>
    <div class="panel">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:14px;">
        <div class="row">
          <div class="field"><label>Categoría</label>
            <select onchange="setAsistCategoryFilter(this.value)">${categories.map(c=>`<option ${c===asistCategoryFilter?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Fecha</label><input type="date" value="${asistSelectedDate}" onchange="setAsistDate(this.value)"></div>
        </div>
        <div style="font-weight:700;align-self:flex-end;">${markedCount} de ${filtered.length} marcados</div>
      </div>
    </div>
    <div class="panel">
      ${rows}
      <div class="hint" style="margin-top:10px;">CTEIB cuenta como asistencia en el %. "Llegó tarde" no suma — avisame si preferís que sí cuente.</div>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:14px;">
        <h3 style="margin:0;">% de asistencia</h3>
        <div class="field" style="min-width:180px;"><label>Mes de referencia</label><select onchange="setAttMonthFilter(this.value)">${monthOptions}</select></div>
      </div>
      <table><thead><tr><th>Atleta</th><th>% mensual (${formatMonthLabel(attMonthFilter)})</th><th>% anual (${attMonthFilter.slice(0,4)})</th></tr></thead><tbody>${summary}</tbody></table>
    </div>
    <div class="panel"><h3 style="margin-top:0;">Fechas registradas</h3>${datesList}</div>
  `;
}

function attendancePct(athleteId, period, isYear=false){
  const dates = uniqueDates().filter(d => isYear ? d.slice(0,4)===period : d.slice(0,7)===period);
  if(dates.length===0) return null;
  let counted=0;
  dates.forEach(d=>{
    const rec = state.attendance.find(r=>r.athleteId===athleteId && r.date===d);
    if(rec && ATTENDANCE_COUNTS_AS_PRESENT.includes(rec.status)) counted++;
  });
  return Math.round((counted/dates.length)*100);
}
function pctBadge(pct){
  if(pct===null) return `<span class="hint">Sin datos</span>`;
  let cls='pct-low'; if(pct>=85) cls='pct-high'; else if(pct>=65) cls='pct-mid';
  return `<span class="pct-badge ${cls}">${pct}%</span>`;
}

window.setAttendanceStatusForDate = async function(athleteId, date, status){
  const athlete = state.athletes.find(a=>a.id===athleteId);
  const existing = state.attendance.find(r=>r.athleteId===athleteId && r.date===date);
  try{
    if(existing && existing.status===status){
      await deleteDoc(doc(db,'attendance',existing.id));
    }else if(existing){
      await updateDoc(doc(db,'attendance',existing.id), {status});
    }else{
      await addDoc(collection(db,'attendance'), {athleteId, authUid: athlete.authUid||null, date, status});
    }
  }catch(e){ alert('Error: '+e.message); }
};
window.deleteAttendanceDate = async function(date){
  if(!confirm('¿Eliminar todas las marcas de asistencia de esta fecha?')) return;
  showBusy('Eliminando...');
  const toDelete = state.attendance.filter(r=>r.date===date);
  for(const r of toDelete) await deleteDoc(doc(db,'attendance',r.id));
  hideBusy();
};

/* ============================================================
   CONTROL FÍSICO
   ============================================================ */
let fisicoSelectedAthlete = null;
window.setFisicoSelectedAthlete = function(v){ fisicoSelectedAthlete = v; render(); };
let fisicoView = 'list';
let fisicoActiveGroup = undefined;
const UNGROUPED_KEY = '__sin_agrupar__';

function testsInGroupSorted(groupId){
  return state.testDefs.filter(t => (t.groupId||null)===groupId)
    .sort((a,b)=> colorOrder(a.color)-colorOrder(b.color) || a.name.localeCompare(b.name));
}
function realGroupId(key){ return key===UNGROUPED_KEY ? null : key; }
function fisicoGroupsOverview(){
  const list = state.testGroups.map(g => ({id:g.id, name:g.name, count: testsInGroupSorted(g.id).length}));
  const ungroupedCount = testsInGroupSorted(null).length;
  if(ungroupedCount>0 || state.testGroups.length===0){
    list.push({id:UNGROUPED_KEY, name:'Sin agrupar', count: ungroupedCount});
  }
  return list;
}

function viewFisico(){
  if(state.athletes.length===0){
    return `<h2 class="page-title">Control físico</h2><div class="panel"><div class="empty-state">Agregá atletas primero.</div></div>`;
  }
  if(!fisicoSelectedAthlete) fisicoSelectedAthlete = state.athletes[0].id;
  return (fisicoView==='detail' && fisicoActiveGroup!==undefined) ? renderFisicoGroupDetail() : renderFisicoGroupList();
}

function renderFisicoGroupList(){
  const groups = fisicoGroupsOverview();
  const cards = groups.map(g => `
    <div class="test-group-card">
      <div class="test-group-head"><strong>${escapeHtml(g.name)}</strong><span class="hint">${g.count} ejercicio(s)</span></div>
      <div class="test-row" style="justify-content:flex-end;"><button class="btn small" onclick="enterFisicoGroup('${g.id}')">Entrar →</button></div>
    </div>
  `).join('') || `<div class="empty-state">Todavía no creaste ninguna prueba.</div>`;
  return `
    <h2 class="page-title">Control físico</h2>
    <p class="page-sub">Organizá las pruebas físicas y entrá a cada una para agregar ejercicios y registrar resultados.</p>
    <div class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;">
        <h3 style="margin:0;">Pruebas</h3>
        <div class="row"><button class="btn secondary" onclick="openBlankSheetPicker()">🖨 Planilla en blanco</button><button class="btn" onclick="newTestGroup()">+ Nueva prueba</button></div>
      </div>
      ${cards}
    </div>
    <div id="printArea" style="display:none;"></div>
  `;
}
window.enterFisicoGroup = function(key){ fisicoActiveGroup=key; fisicoView='detail'; render(); };
window.backToFisicoList = function(){ fisicoView='list'; fisicoActiveGroup=undefined; render(); };

function renderFisicoGroupDetail(){
  const key = fisicoActiveGroup;
  const groupId = realGroupId(key);
  const isReal = key!==UNGROUPED_KEY;
  const groupName = isReal ? ((state.testGroups.find(g=>g.id===groupId)||{}).name || 'Prueba') : 'Sin agrupar';
  const tests = testsInGroupSorted(groupId);

  const rows = tests.map(t => `
    <div class="test-row">
      <span class="color-dot" style="background:${colorHex(t.color)};" title="${colorLabel(t.color)}"></span>
      <span class="test-name">${escapeHtml(t.name)}</span>
      ${t.type==='passfail' ? `<span class="tag">Apto / No apto</span>`
        : t.type==='scoretime' ? `<span class="tag">Puntuación + Tiempo</span>`
        : `<span class="hint" style="min-width:60px;">${escapeHtml(t.unit||'—')}</span><span class="hint" style="min-width:110px;">${t.higherIsBetter?'Mayor es mejor':'Menor es mejor'}</span>`}
      ${t.allowPhoto ? `<span class="tag" title="Admite foto de resultado">📷</span>` : ''}
      ${t.isJumpTest ? `<span class="tag" title="Calcula % respecto a la estatura">📏 %</span>` : ''}
      <span class="tag">${t.location==='agua'?'Agua':'Seco'}</span>
      <button class="btn small secondary" onclick="editTestDef('${t.id}')">Editar</button>
      <button class="btn small danger" onclick="deleteTestDef('${t.id}')">Eliminar</button>
    </div>
  `).join('') || `<div class="test-row"><span class="hint">Todavía no hay ejercicios en esta prueba.</span></div>`;

      </div>
      ${rows}
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:14px;">
        <h3 style="margin:0;">Registrar resultados</h3>
        <div class="row">
          <button class="btn secondary" onclick="openBlankSheetAthletePicker('${key}')" ${tests.length===0?'disabled':''}>🖨 Planilla en blanco</button>
          <button class="btn" onclick="newTestResultsBatch('${key}')" ${tests.length===0?'disabled':''}>+ Registrar resultados</button>
        </div>
      </div>

    <div class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:6px;">

window.newTestResultsBatch = function(groupKey){
  pendingResultPhotos = {};

  const athleteOptions = state.athletes.map(a=>`<option value="${a.id}" ${a.id===fisicoSelectedAthlete?'selected':''}>${escapeHtml(a.name)}</option>`).join('');

      inputPart = `<select id="res_${t.id}" style="width:150px;"><option value="">— Sin registrar —</option><option value="1">Apto</option><option value="0">No apto</option></select>`;
    }else if(t.type==='scoretime'){
      inputPart = `<input type="number" step="any" id="res_${t.id}_score" placeholder="${t.scoreUnit?('Puntuación ('+escapeAttr(t.scoreUnit)+')'):'Puntuación'}" style="width:135px;"><input type="number" step="any" id="res_${t.id}_time" placeholder="${t.timeUnit?('Tiempo ('+escapeAttr(t.timeUnit)+')'):'Tiempo'}" style="width:135px;">`;

    }

    return `<div class="res-row"><span class="color-dot" style="background:${colorHex(t.color)};"></span><label for="res_${t.id}">${escapeHtml(t.name)}</label>${inputPart}${photoPart}</div>`;
  }).join('') || `<div class="hint">Esta prueba todavía no tiene ejercicios.</div>`;

  openDialog('Registrar resultados', `
    <div class="field"><label>Atleta</label><select id="f_ath">${athleteOptions}</select></div>
    <div class="field"><label>Fecha</label><input id="f_date" type="date" value="${today}"></div>
    <div class="divider"></div>
    ${rowsHtml}
    <div class="hint">Dejá en blanco los ejercicios que no quieras cargar hoy.</div>
  `, async () => {
    const athleteId = document.getElementById('f_ath').value;
    const athlete = state.athletes.find(a=>a.id===athleteId);
    const date = document.getElementById('f_date').value;
    if(!date){ alert('Elegí una fecha.'); return; }
    closeDialog(); showBusy('Guardando...');
    let count = 0;
    try{
      for(const t of tests){
        const photoDataUrl = pendingResultPhotos[t.id] || null;
        let value, value2;
        if(t.type==='scoretime'){
          const scoreRaw = (document.getElementById('res_'+t.id+'_score')||{}).value ?? '';
          const timeRaw = (document.getElementById('res_'+t.id+'_time')||{}).value ?? '';
          if(scoreRaw==='' && timeRaw==='' && !photoDataUrl) continue;
          if(scoreRaw!=='' && !isNaN(parseFloat(scoreRaw))) value = parseFloat(scoreRaw);
          if(timeRaw!=='' && !isNaN(parseFloat(timeRaw))) value2 = parseFloat(timeRaw);
        }else{
          const raw = (document.getElementById('res_'+t.id)||{}).value ?? '';
          if(raw===''){
            if(!photoDataUrl) continue;
          }else{
            const v = parseFloat(raw);
            if(isNaN(v)) continue;
            value = v;
          }
        }
        const resultRef = doc(collection(db,'testResults'));
        const rec = {athleteId, authUid: athlete.authUid||null, testId:t.id, date};
        if(value!==undefined) rec.value = value;
        if(value2!==undefined) rec.value2 = value2;
        if(photoDataUrl){
          rec.photoUrl = photoDataUrl;
        }
        await setDoc(resultRef, rec);
        count++;
      }
      if(count===0){ alert('No ingresaste ningún valor ni foto.'); }
      fisicoSelectedAthlete = athleteId;
    }catch(e){ alert('Error: '+e.message); }
    hideBusy();
  }, {wide:true});
};

/* ---- Gráficos de progreso (funciones puras) ---- */
function renderTestChart(athleteId, testDef){
  const points = state.testResults.filter(r=>r.athleteId===athleteId && r.testId===testDef.id).sort((a,b)=>a.date.localeCompare(b.date));
  const titleHtml = `<div class="chart-title"><span class="color-dot" style="background:${colorHex(testDef.color)};display:inline-block;margin-right:6px;"></span>${escapeHtml(testDef.name)} <span class="tag">${testDef.location==='agua'?'Agua':'Seco'}</span></div>`;
  if(points.length===0) return `<div class="chart-wrap">${titleHtml}<div class="hint">Sin registros todavía.</div>${renderPhotoComparison(points, testDef)}</div>`;
  if(testDef.type==='passfail') return renderPassFailTimeline(points, testDef, titleHtml);
  if(testDef.type==='scoretime') return renderScoreTimeCharts(points, testDef, titleHtml);

  let deltaHtml='';
  const valPoints = points.filter(p=>p.value!==undefined);
  if(valPoints.length>=2){
    const last=valPoints[valPoints.length-1].value, prev=valPoints[valPoints.length-2].value;
    const diff=last-prev; const improved=testDef.higherIsBetter?diff>0:diff<0; const flat=diff===0;
    const cls=flat?'delta-flat':(improved?'delta-up':'delta-down'); const arrow=flat?'→':(diff>0?'↑':'↓');
    deltaHtml = `<span class="chart-delta ${cls}">${arrow} ${diff>0?'+':''}${diff.toFixed(2)} ${escapeHtml(testDef.unit||'')} vs. control anterior — ${flat?'sin cambio':(improved?'mejoró':'bajó')}</span>`;
  }
  const svg = valPoints.length ? lineChartSVG(valPoints, testDef) : `<div class="hint">Sin valores numéricos todavía.</div>`;
  const jumpHtml = testDef.isJumpTest && valPoints.length ? renderJumpPercent(athleteId, valPoints) : '';
  return `<div class="chart-wrap">${titleHtml}<div>${deltaHtml}</div>${svg}${jumpHtml}${renderPhotoComparison(points, testDef)}</div>`;
}
function renderJumpPercent(athleteId, points){
  const athlete = state.athletes.find(a=>a.id===athleteId);
  if(!athlete || !athlete.height) return `<div class="hint">Cargá la estatura de esta atleta en "Atletas" para ver el % de salto.</div>`;
  const height = athlete.height;
  const last = points[points.length-1];
  const pct = (last.value/height)*100;
  let deltaPct='';
  if(points.length>=2){
    const prev = points[points.length-2];
    const diff = pct - (prev.value/height)*100;
    const flat = Math.abs(diff)<0.01;
    const cls = flat?'delta-flat':(diff>0?'delta-up':'delta-down'); const arrow=flat?'→':(diff>0?'↑':'↓');
    deltaPct = ` <span class="chart-delta ${cls}" style="margin-left:6px;">${arrow} ${diff>0?'+':''}${diff.toFixed(1)} pts</span>`;
  }
  return `<div class="jump-pct">📏 ${last.value} cm es el <strong>${pct.toFixed(1)}%</strong> de su estatura (${height} cm)${deltaPct}</div>`;
}
function deltaForPoints(points, key, higherIsBetter, unit){
  const withVal = points.filter(p=>p[key]!==undefined && p[key]!==null);
  if(withVal.length<2) return '';
  const last=withVal[withVal.length-1][key], prev=withVal[withVal.length-2][key];
  const diff=last-prev; const improved=higherIsBetter?diff>0:diff<0; const flat=diff===0;
  const cls=flat?'delta-flat':(improved?'delta-up':'delta-down'); const arrow=flat?'→':(diff>0?'↑':'↓');
  return `<span class="chart-delta ${cls}">${arrow} ${diff>0?'+':''}${diff.toFixed(2)} ${escapeHtml(unit||'')} — ${flat?'sin cambio':(improved?'mejoró':'bajó')}</span>`;
}
function renderScoreTimeCharts(points, testDef, titleHtml){
  const scorePoints = points.filter(p=>p.value!==undefined && p.value!==null);
  const timePoints = points.filter(p=>p.value2!==undefined && p.value2!==null);
  const scoreBlock = scorePoints.length ? `<div class="chart-subtitle">Puntuación ${testDef.scoreUnit?`(${escapeHtml(testDef.scoreUnit)})`:''}</div><div>${deltaForPoints(points,'value',testDef.scoreHigherIsBetter,testDef.scoreUnit)}</div>${lineChartSVG(scorePoints, testDef, {valueKey:'value'})}` : `<div class="chart-subtitle">Puntuación</div><div class="hint">Sin datos todavía.</div>`;
  const timeBlock = timePoints.length ? `<div class="chart-subtitle">Tiempo ${testDef.timeUnit?`(${escapeHtml(testDef.timeUnit)})`:''}</div><div>${deltaForPoints(points,'value2',testDef.timeHigherIsBetter,testDef.timeUnit)}</div>${lineChartSVG(timePoints, testDef, {valueKey:'value2'})}` : `<div class="chart-subtitle">Tiempo</div><div class="hint">Sin datos todavía.</div>`;
  return `<div class="chart-wrap">${titleHtml}<div class="grid-2"><div>${scoreBlock}</div><div>${timeBlock}</div></div>${renderPhotoComparison(points, testDef)}</div>`;
}
function renderPassFailTimeline(points, testDef, titleHtml){
  let deltaHtml='';
  if(points.length>=2){
    const last=points[points.length-1].value, prev=points[points.length-2].value;
    deltaHtml = last===prev ? `<span class="chart-delta delta-flat">→ Sin cambio</span>` : (last===1 ? `<span class="chart-delta delta-up">↑ Pasó a Apto</span>` : `<span class="chart-delta delta-down">↓ Pasó a No apto</span>`);
  }
  const badges = points.map(p=>`<div style="text-align:center;"><div style="padding:6px 12px;border-radius:6px;font-weight:700;font-size:12px;background:${p.value===1?'#E4EEE6':'#F7E2DD'};color:${p.value===1?'var(--green)':'var(--red)'};">${p.value===1?'Apto':'No apto'}</div><div class="hint" style="margin-top:4px;">${formatDateShort(p.date)}</div></div>`).join('');
  return `<div class="chart-wrap">${titleHtml}<div>${deltaHtml}</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;">${badges}</div>${renderPhotoComparison(points, testDef)}</div>`;
}
function renderPhotoComparison(points, testDef){
  if(!testDef.allowPhoto) return '';
  const lastWithPhoto = [...points].reverse().find(p=>p.photoUrl);
  if(!testDef.exampleImageUrl && !lastWithPhoto) return '';
  return `<div class="photo-compare"><div class="photo-compare-title">Comparación</div><div class="row" style="gap:14px;flex-wrap:wrap;">
    <div>${testDef.exampleImageUrl ? `<img src="${testDef.exampleImageUrl}" class="compare-img">` : `<div class="compare-img compare-img-empty">Sin ejemplo</div>`}<div class="hint" style="text-align:center;margin-top:4px;">Ejemplo</div></div>
    <div>${lastWithPhoto ? `<img src="${lastWithPhoto.photoUrl}" class="compare-img">` : `<div class="compare-img compare-img-empty">Sin foto todavía</div>`}<div class="hint" style="text-align:center;margin-top:4px;">${lastWithPhoto?formatDateShort(lastWithPhoto.date):'Resultado'}</div></div>
  </div></div>`;
}
function lineChartSVG(points, testDef, opts){
  opts = opts||{};
  const valueKey = opts.valueKey || 'value';
  const W=640,H=160,padL=40,padR=16,padT=16,padB=28;
  const values = points.map(p=>p[valueKey]);
  let min=Math.min(...values), max=Math.max(...values);
  if(min===max){ min-=1; max+=1; }
  const range=max-min;
  const stepX = points.length>1 ? (W-padL-padR)/(points.length-1) : 0;
  const lineColor = opts.color || colorHex(testDef.color);
  const coords = points.map((p,i)=>{
    const x=padL+stepX*i;
    const y=padT+(H-padT-padB)*(1-(p[valueKey]-min)/range);
    return {x,y,v:p[valueKey],date:p.date};
  });
  const pathD = coords.map((c,i)=>(i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const dots = coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="${lineColor}"></circle>`).join('');
  const labels = coords.map(c=>`<text x="${c.x.toFixed(1)}" y="${H-8}" font-size="10" fill="#7C8C8C" text-anchor="middle">${formatDateShort(c.date)}</text>`).join('');
  const valueLabels = coords.map(c=>`<text x="${c.x.toFixed(1)}" y="${(c.y-8).toFixed(1)}" font-size="10" fill="#0B2B3C" text-anchor="middle">${c.v}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="max-width:640px;"><line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#D8DDD9"/><line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#D8DDD9"/><path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="2.5"/>${dots}${valueLabels}${labels}</svg>`;
}

/* ---- Planilla en blanco / impresión (sin cambios, cliente puro) ---- */
window.openBlankSheetPicker = function(){
  const groups = fisicoGroupsOverview().filter(g=>g.count>0);
  if(groups.length===0){ alert('Todavía no hay ejercicios cargados.'); return; }
  if(state.athletes.length===0){ alert('Todavía no hay atletas cargadas.'); return; }
  const groupChecks = groups.map(g=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;"><input type="checkbox" class="bs-check" value="${g.id}" checked><span>${escapeHtml(g.name)} (${g.count} ejercicio(s))</span></label>`).join('');
  const athleteChecks = [...state.athletes].sort((a,b)=>a.name.localeCompare(b.name)).map(a=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;"><input type="checkbox" class="bs-athcheck" value="${a.id}" checked><span>${escapeHtml(a.name)}${a.category?` · ${escapeHtml(a.category)}`:''}</span></label>`).join('');
  openDialog('Elegí qué pruebas y atletas incluir', `
    <div><strong>Pruebas</strong></div><div>${groupChecks}</div>
    <div class="divider"></div>
    <div class="row" style="justify-content:space-between;"><strong>Atletas</strong><span class="hint" style="cursor:pointer;" onclick="toggleAllCheckboxes('bs-athcheck')">Marcar/desmarcar todas</span></div>
    <div>${athleteChecks}</div>
  `, () => {
    const checkedGroups = Array.from(document.querySelectorAll('.bs-check')).filter(c=>c.checked).map(c=>c.value);
    const checkedAthletes = Array.from(document.querySelectorAll('.bs-athcheck')).filter(c=>c.checked).map(c=>c.value);
    if(checkedGroups.length===0){ alert('Elegí al menos una prueba.'); return; }
    if(checkedAthletes.length===0){ alert('Elegí al menos una atleta.'); return; }
    closeDialog();
    printBlankSheet(checkedGroups, checkedAthletes);
  }, {wide:true});
};
window.openBlankSheetAthletePicker = function(key){
  if(state.athletes.length===0){ alert('Todavía no hay atletas cargadas.'); return; }
  const athleteChecks = [...state.athletes].sort((a,b)=>a.name.localeCompare(b.name)).map(a=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;"><input type="checkbox" class="bs-athcheck" value="${a.id}" checked><span>${escapeHtml(a.name)}${a.category?` · ${escapeHtml(a.category)}`:''}</span></label>`).join('');
  openDialog('Elegí qué atletas incluir', `
    <div class="row" style="justify-content:space-between;"><strong>Atletas</strong><span class="hint" style="cursor:pointer;" onclick="toggleAllCheckboxes('bs-athcheck')">Marcar/desmarcar todas</span></div>
    <div>${athleteChecks}</div>
  `, () => {
    const checkedAthletes = Array.from(document.querySelectorAll('.bs-athcheck')).filter(c=>c.checked).map(c=>c.value);
    if(checkedAthletes.length===0){ alert('Elegí al menos una atleta.'); return; }
    closeDialog();
    printBlankSheet(key, checkedAthletes);
  });
};
window.toggleAllCheckboxes = function(className){
  const boxes = Array.from(document.querySelectorAll('.'+className));
  const allChecked = boxes.every(b=>b.checked);
  boxes.forEach(b=> b.checked = !allChecked);
};
window.printBlankSheet = function(scopeKeys, athleteIds){
  let keys = scopeKeys==null ? fisicoGroupsOverview().map(g=>g.id) : (Array.isArray(scopeKeys)?scopeKeys:[scopeKeys]);
  let sections = keys.map(key=>{
    const groupId = realGroupId(key);
    const name = key===UNGROUPED_KEY ? 'Sin agrupar' : ((state.testGroups.find(g=>g.id===groupId)||{}).name || 'Prueba');
    return {name, tests: testsInGroupSorted(groupId)};
  }).filter(s=>s.tests.length>0);
  if(sections.length===0){ alert('Todavía no hay ejercicios cargados.'); return; }
  const athletesSorted = (athleteIds ? state.athletes.filter(a=>athleteIds.includes(a.id)) : state.athletes).slice().sort((a,b)=>a.name.localeCompare(b.name));
  if(athletesSorted.length===0){ alert('No hay atletas seleccionadas.'); return; }
  const sectionsHtml = sections.map((sec, idx) => {
    const headCols = sec.tests.map(t=>{
      const sub = t.type==='passfail' ? 'Apto / No apto' : (t.unit||'');
      return `<th style="border:1px solid #333;padding:6px;">${escapeHtml(t.name)}${sub?`<br><span style="font-weight:400;font-size:10px;">${escapeHtml(sub)}</span>`:''}</th>`;
    }).join('');
    const bodyRows = athletesSorted.map(a=>`<tr><td style="border:1px solid #333;padding:6px;font-weight:700;white-space:nowrap;">${escapeHtml(a.name)}</td>${sec.tests.map(()=>`<td style="border:1px solid #333;height:36px;"></td>`).join('')}</tr>`).join('');
    return `<div style="padding:20px 0;${idx<sections.length-1?'page-break-after:always;':''}"><h1 style="margin:0 0 4px;">Planilla de control físico</h1><h2 style="margin:0 0 10px;color:#5A6B6B;">${escapeHtml(sec.name)}</h2><div style="margin-bottom:14px;">Fecha: _____________________</div><table style="border-collapse:collapse;width:100%;"><thead><tr><th style="border:1px solid #333;padding:6px;">Atleta</th>${headCols}</tr></thead><tbody>${bodyRows}</tbody></table></div>`;
  }).join('');
  const area = document.getElementById('printArea');
  area.innerHTML = sectionsHtml; area.style.display='block';
  document.body.classList.add('print-mode'); window.print();
  setTimeout(()=>{ area.style.display='none'; document.body.classList.remove('print-mode'); }, 500);
};
window.printReport = function(groupKey){
  const athlete = state.athletes.find(a=>a.id===fisicoSelectedAthlete);
  const area = document.getElementById('printArea');
  const groupId = realGroupId(groupKey);
  const groupName = groupKey===UNGROUPED_KEY ? 'Sin agrupar' : ((state.testGroups.find(g=>g.id===groupId)||{}).name || '');
  const tests = testsInGroupSorted(groupId);
  const charts = tests.map(t=>renderTestChart(fisicoSelectedAthlete, t)).join('');
  area.innerHTML = `<div style="padding:20px;"><h1 style="margin:0;">Reporte de control físico — ${escapeHtml(groupName)}</h1><h2 style="margin:4px 0 20px;color:#5A6B6B;">${escapeHtml(athlete.name)} · ${new Date().toLocaleDateString('es-AR')}</h2>${charts}</div>`;
  area.style.display='block';
  document.body.classList.add('print-mode'); window.print();
  setTimeout(()=>{ area.style.display='none'; document.body.classList.remove('print-mode'); }, 500);
};

/* ============================================================
   PERFIL DE ATLETA (solo lectura)
   ============================================================ */
function renderAthleteProfile(athlete){
  if(!athlete) return `<div class="panel"><div class="empty-state">Cargando tu perfil...</div></div>`;
  const initial = athlete.name.trim().charAt(0).toUpperCase();
  const monthKey = new Date().toISOString().slice(0,7);
  const monthly = attendancePct(athlete.id, monthKey);
  const annual = attendancePct(athlete.id, monthKey.slice(0,4), true);
  const sections = fisicoGroupsOverview().map(g=>{
    const groupId = realGroupId(g.id);
    const tests = testsInGroupSorted(groupId).filter(t => state.testResults.some(r=>r.testId===t.id));
    if(tests.length===0) return '';
    return `<div class="panel"><h3 style="margin-top:0;">${escapeHtml(g.name)}</h3>${tests.map(t=>renderTestChart(athlete.id, t)).join('')}</div>`;
  }).join('');
  return `
    <div class="row" style="justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      <div class="athlete-profile-header">
        <div class="athlete-avatar">${escapeHtml(initial)}</div>
        <div><h2 class="page-title" style="margin:0;">${escapeHtml(athlete.name)}</h2><div class="hint">${escapeHtml(athlete.category||'')}</div></div>
      </div>
      <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
    </div>
    <div class="grid-2" style="margin-bottom:6px;">
      <div class="stat-box"><div class="num">${monthly===null?'—':monthly+'%'}</div><div class="lbl">Asistencia este mes</div></div>
      <div class="stat-box"><div class="num">${annual===null?'—':annual+'%'}</div><div class="lbl">Asistencia este año</div></div>
    </div>
    ${sections || `<div class="panel"><div class="empty-state">Todavía no hay resultados de control físico cargados.</div></div>`}
  `;
}
